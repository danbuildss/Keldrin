name: Publish to MCP Registry
# Manual only: the founder clicks "Run workflow" and types the version in server.json to confirm.
# Follows the registry's official GitHub Actions guide (GitHub OIDC login, no stored secret): the namespace
# io.github.danbuildss/ is proven by this repository's own OIDC token. mcp-publisher is pinned and its Sigstore
# bundle is verified before it runs (never the mutable releases/latest URL).
on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Type the version in server.json to confirm (e.g. 0.7.1)"
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # required for the registry's GitHub OIDC login
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.21
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the version
        env:
          WANT: ${{ inputs.confirm_version }}
        run: |
          HAVE=$(jq -r .version server.json)
          if [ "$HAVE" != "$WANT" ]; then echo "server.json is $HAVE, you typed $WANT"; exit 1; fi
          LEN=$(jq -r '.description | length' server.json)
          if [ "$LEN" -gt 100 ]; then echo "description is $LEN characters (limit 100)"; exit 1; fi
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
      - name: Check the listing
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.danbuildss/keldrin" | jq -e '.servers | length > 0' >/dev/null; then echo "listed"; exit 0; fi
            sleep 10
          done
          echo "published, but the search does not show it yet; check again in a few minutes"
