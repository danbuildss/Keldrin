name: Keldrin research (scheduled)
# Phase 4 (founder approved 2026-11-27): scheduled 3 times a day (02:23, 10:23, 18:23 UTC) plus manual dispatch.
# Observed 2026-11-28: GitHub ran 1 of the first 2 scheduled slots, 3 h 41 min late, and skipped the other. Writes to Supabase only through
# the least-privilege `keldrin_writer` login (append + asset upsert; no delete, no DDL).
# Disabled unless the repository variable RESEARCH_ENABLED is "true". GitHub cron can be delayed or skipped:
# freshness is shown by /health, not promised.
on:
  schedule:
    - cron: "23 2,10,18 * * *"
  workflow_dispatch:
    inputs:
      symbols:
        description: Optional comma-separated token symbols (empty = all tokens)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: keldrin-research
  cancel-in-progress: false
jobs:
  research:
    if: vars.RESEARCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: keldrin-research
    timeout-minutes: 45
    steps:
      # Actions pinned to the commits their tags pointed to on 2026-11-27 (git ls-remote).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Discover, verify and store (Supabase, writer role)
        run: node src/cli.ts discover --db=pg ${SYMBOLS:+--symbols=$SYMBOLS}
        env:
          SYMBOLS: ${{ inputs.symbols }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_BEARER: ${{ secrets.BASE_RPC_BEARER }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          KELDRIN_WRITER_URL: ${{ secrets.KELDRIN_WRITER_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      - name: Reconcile with SEC and build the calendar
        run: node src/cli.ts reconcile --db=pg && node src/cli.ts calendar --db=pg
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_BEARER: ${{ secrets.BASE_RPC_BEARER }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          KELDRIN_WRITER_URL: ${{ secrets.KELDRIN_WRITER_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      - name: Index and independently verify Chainlink NAV history
        run: node src/cli.ts nav-index --db=pg ${SYMBOLS:+--symbols=$SYMBOLS} && node src/cli.ts nav-verify --db=pg ${SYMBOLS:+--symbols=$SYMBOLS}
        env:
          SYMBOLS: ${{ inputs.symbols }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_BEARER: ${{ secrets.BASE_RPC_BEARER }}
          KELDRIN_WRITER_URL: ${{ secrets.KELDRIN_WRITER_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      - name: Discover and independently verify DEX pools
        run: node src/cli.ts dex-index --db=pg ${SYMBOLS:+--symbols=$SYMBOLS} && node src/cli.ts dex-verify --db=pg ${SYMBOLS:+--symbols=$SYMBOLS}
        env:
          SYMBOLS: ${{ inputs.symbols }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_BEARER: ${{ secrets.BASE_RPC_BEARER }}
          KELDRIN_WRITER_URL: ${{ secrets.KELDRIN_WRITER_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      - name: Earnings releases (SEC 8-K item 2.02)
        if: ${{ !cancelled() }}
        run: node src/cli.ts earnings-index --db=pg ${SYMBOLS:+--symbols=$SYMBOLS}
        env:
          SYMBOLS: ${{ inputs.symbols }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          KELDRIN_WRITER_URL: ${{ secrets.KELDRIN_WRITER_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      - name: Re-check earnings releases against SEC filing headers (at most 1500 per run)
        if: ${{ !cancelled() }}
        run: node src/cli.ts earnings-verify --db=pg
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          KELDRIN_WRITER_URL: ${{ secrets.KELDRIN_WRITER_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      - name: Count keldrin's x402 payments onchain (incremental)
        # independent of the research data: runs even if an earlier step failed, and fails the job visibly if it fails
        if: ${{ !cancelled() }}
        run: node src/cli.ts payments-index --db=pg
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_RPC_BEARER: ${{ secrets.BASE_RPC_BEARER }}
          KELDRIN_WRITER_URL: ${{ secrets.KELDRIN_WRITER_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      # The run's evidence files are a private artifact for review; nothing is committed or published.
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keldrin-records-${{ github.run_id }}
          path: |
            records/
            data/_last_nav_index.json
          retention-days: 14
