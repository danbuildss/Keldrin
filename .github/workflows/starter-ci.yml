name: Keldrin CI
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # TODO(security): pin actions to reviewed commit SHAs before any secret is added to this repo.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.23.0
      - run: python scripts/check_kit.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Offline: replays recorded real responses; no network secrets needed.
      - run: npm test
