name: Keldrin CI
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to the commits their tags pointed to on 2026-11-27 (git ls-remote).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.23.0
      - run: python scripts/check_kit.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      # Offline: replays recorded real responses; no network secrets needed.
      - run: npm test
      # The deployed function is the committed bundle; it must match the source.
      - run: npm run build:api && git diff --exit-code -- 'api/'
