name: keldrin status
# Read-only checks of what users and agents rely on (site, API freshness, MCP, agent guide, live chain read, and the
# x402 terms of both paid endpoints). No secrets, no payments. A failed run emails the repository owner.
# Every 6 hours, offset from the research run, to keep Actions minutes low.
on:
  schedule:
    - cron: "41 2,8,14,20 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/status-check.mjs
